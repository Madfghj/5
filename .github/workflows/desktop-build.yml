name: Desktop download builds

on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Create a draft GitHub prerelease after all desktop builds pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: true
      RUSTUP_TOOLCHAIN: 1.90.0
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      # Test artifact only. No Apple certificate, account or notarization is used.
      APPLE_SIGNING_IDENTITY: '-'
      VITE_API_URL: https://opencalendar-space-live.optimisticraccoon.chatgpt.site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select an installed Xcode 26 toolchain with Intel macOS support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, pathlib, re, subprocess
          candidates=[]
          for path in glob.glob('/Applications/Xcode*.app/Contents/Developer'):
              result=subprocess.run(['/usr/bin/xcodebuild','-version'],env={**os.environ,'DEVELOPER_DIR':path},capture_output=True,text=True)
              version=re.search(r'^Xcode (26(?:\.\d+)*)$',result.stdout,re.M)
              if result.returncode==0 and version:
                  candidates.append((tuple(map(int,version.group(1).split('.'))),path))
          if not candidates:
              raise SystemExit('This runner has no Xcode 26. Use an image with the Intel-capable macOS SDK; do not silently change the deployment target.')
          _,selected=max(candidates)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('DEVELOPER_DIR='+selected+'\n')
          print('Selected '+selected)
          PY
      - name: Install locked JavaScript dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Install the pinned Rust compiler and both macOS architectures
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 x86_64-apple-darwin aarch64-apple-darwin
          rustc --version
          cargo --version
          xcodebuild -version
      - name: Validate the shared application and native manifest
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          pnpm test
          cd src-tauri
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Compile the universal Monterey desktop client
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target universal-apple-darwin --bundles app,dmg -- --locked
      - name: Verify the native binary and package the app without losing bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/OpenCalendar-desktop-artifacts"
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, plistlib, re, shutil, subprocess
          root=pathlib.Path.cwd()
          app=root/'src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenCalendar.app'
          info=plistlib.loads((app/'Contents/Info.plist').read_bytes())
          expected=json.loads((root/'package.json').read_text())['version']
          if info.get('CFBundleIdentifier')!='space.opencalendar.app' or info.get('CFBundleShortVersionString')!=expected:
              raise SystemExit('Native app identity/version differs from the project')
          def version(value):
              return tuple((list(map(int,value.split('.')))+[0,0])[:3])
          if version(info.get('LSMinimumSystemVersion','999'))!=version('12.0'):
              raise SystemExit('The app must declare macOS Monterey 12.0 as its minimum')
          schemes=[scheme for item in info.get('CFBundleURLTypes',[]) for scheme in item.get('CFBundleURLSchemes',[])]
          if 'space.opencalendar.app' not in schemes:
              raise SystemExit('The desktop OAuth return scheme was not registered in the bundle')
          binary=app/'Contents/MacOS'/info['CFBundleExecutable']
          architectures=subprocess.check_output(['lipo','-archs',str(binary)],text=True).split()
          if set(architectures)!={'x86_64','arm64'}:
              raise SystemExit('Expected both Intel x86_64 and Apple silicon arm64')
          minimums={}
          for architecture in sorted(architectures):
              load_commands=subprocess.check_output(['xcrun','vtool','-arch',architecture,'-show-build',str(binary)],text=True)
              values=re.findall(r'^\s*minos\s+(\d+(?:\.\d+)*)\s*$',load_commands,re.M)
              if not values or any(version(value)!=version('12.0') for value in values):
                  raise SystemExit('Native load commands do not target macOS 12.0 for '+architecture)
              minimums[architecture]=values[0]
          subprocess.run(['codesign','--verify','--deep','--strict',str(app)],check=True)
          signature=subprocess.run(['codesign','-d','--verbose=4',str(app)],capture_output=True,text=True,check=True).stderr
          if 'Signature=adhoc' not in signature:
              raise SystemExit('Expected an explicitly ad-hoc test signature')
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'OpenCalendar-desktop-artifacts'
          archive=output/f'OpenCalendar-{expected}-macOS12-universal-test.zip'
          subprocess.run(['ditto','-c','-k','--sequesterRsrc','--keepParent',str(app),str(archive)],check=True)
          disks=list((root/'src-tauri/target/universal-apple-darwin/release/bundle/dmg').glob('*.dmg'))
          if len(disks)!=1:
              raise SystemExit('Expected one generated test DMG')
          disk=output/f'OpenCalendar-{expected}-macOS12-universal-test.dmg'
          shutil.copyfile(disks[0],disk)
          files=[{'name':path.name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in (archive,disk)]
          report={'schemaVersion':1,'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'version':expected,'bundleId':info['CFBundleIdentifier'],'sourceCommit':os.environ['GITHUB_SHA'],'architectures':sorted(architectures),'minimumSystemVersion':info['LSMinimumSystemVersion'],'binaryMinimums':minimums,'signature':'adhoc','developerIdentityVerified':False,'notarized':False,'storePublished':False,'runtimeTestedOnMonterey':False,'files':files}
          (output/'macOS-native-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenCalendar-macOS12-universal-test
          path: ${{ runner.temp }}/OpenCalendar-desktop-artifacts/*
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: true
      RUSTUP_TOOLCHAIN: 1.90.0
      VITE_API_URL: https://opencalendar-space-live.optimisticraccoon.chatgpt.site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies and the pinned Rust compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.90.0 x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile the x64 Windows installer
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Verify and package Windows downloads
        run: python scripts/verify-desktop-packages.py windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenCalendar-Windows-x64-test
          path: ${{ runner.temp }}/OpenCalendar-desktop-artifacts/*
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: true
      RUSTUP_TOOLCHAIN: 1.90.0
      # Extract AppImages during bundling instead of depending on FUSE in CI.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      VITE_API_URL: https://opencalendar-space-live.optimisticraccoon.chatgpt.site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies and the pinned Rust compiler
        run: |
          set -euo pipefail
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 x86_64-unknown-linux-gnu
      - name: Compile the Linux packages
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target x86_64-unknown-linux-gnu --bundles deb,appimage -- --locked
      - name: Verify and package Linux downloads
        run: python3 scripts/verify-desktop-packages.py linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenCalendar-Linux-x64-test
          path: ${{ runner.temp }}/OpenCalendar-desktop-artifacts/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: ${{ inputs.publish_draft }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download only this run's verified desktop artifacts
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name OpenCalendar-macOS12-universal-test --dir release-assets
          gh run download "$GITHUB_RUN_ID" --name OpenCalendar-Windows-x64-test --dir release-assets
          gh run download "$GITHUB_RUN_ID" --name OpenCalendar-Linux-x64-test --dir release-assets
      - name: Verify hashes and create a draft prerelease at this exact source commit
        run: python3 scripts/create-desktop-draft-release.py release-assets
